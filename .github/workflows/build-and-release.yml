name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y build-essential make git
          command -v make
          command -v git

      - name: Download PS5 SDK Release
        run: |
          set -euxo pipefail
          # Download the latest release zip from ps5-payload-dev/sdk
          DOWNLOAD_URL="https://github.com/ps5-payload-dev/sdk/releases/download/latest/sdk.zip"
          echo "Downloading PS5 SDK from: $DOWNLOAD_URL"
          wget -O sdk.zip "$DOWNLOAD_URL" || {
            # If latest doesn't work, try to get the first release
            RELEASE_URL=$(curl -s "https://api.github.com/repos/ps5-payload-dev/sdk/releases" | grep -m1 'browser_download_url.*\.zip' | cut -d'"' -f4)
            echo "Using release URL: $RELEASE_URL"
            wget -O sdk.zip "$RELEASE_URL"
          }
          
          # Extract the SDK
          unzip -q sdk.zip
          
          # Find the SDK directory (it might be in a subdirectory)
          SDK_DIR=$(find . -maxdepth 2 -type d -name "sdk" | head -1)
          if [ -z "$SDK_DIR" ]; then
            SDK_DIR=$(find . -maxdepth 1 -type d | grep -v '^\.$' | head -1)
          fi
          
          # Move to standard location
          mkdir -p "${GITHUB_WORKSPACE}/ps5-sdk"
          if [ -d "$SDK_DIR" ]; then
            cp -r "$SDK_DIR"/* "${GITHUB_WORKSPACE}/ps5-sdk/"
          else
            cp -r ./* "${GITHUB_WORKSPACE}/ps5-sdk/"
          fi
          
          test -d "${GITHUB_WORKSPACE}/ps5-sdk"
          test -f "${GITHUB_WORKSPACE}/ps5-sdk/toolchain/prospero.mk" || echo "Warning: prospero.mk not found, continuing anyway"
          echo "SDK root: ${GITHUB_WORKSPACE}/ps5-sdk"
          ls -la "${GITHUB_WORKSPACE}/ps5-sdk"
          ls -la "${GITHUB_WORKSPACE}/ps5-sdk/toolchain" || true

      - name: Build binaries
        working-directory: ./payload
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-sdk
        run: |
          set -euxo pipefail
          echo "PS5_PAYLOAD_SDK=${PS5_PAYLOAD_SDK}"
          ls -la "${PS5_PAYLOAD_SDK}"
          ls -la "${PS5_PAYLOAD_SDK}/toolchain" || true
          make release

      - name: List generated binaries
        run: |
          set -euxo pipefail
          ls -lh payload/*.elf 2>/dev/null || true
          find payload -maxdepth 1 -name "*.elf" -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poords4-binaries
          path: payload/*.elf
          retention-days: 5
          if-no-files-found: error

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          tag_name: latest-build-${{ github.run_number }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
