name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential llvm netcat-traditional
      
      - name: Display SDK structure
        run: |
          echo "=== Checking PS5 SDK ==="
          ls -la ps5-sdk/ || echo "SDK directory not found"
          echo "=== Current directory ==="
          pwd
          echo "=== Payload directory ==="
          ls -la payload/
      
      - name: Build binaries
        working-directory: ./payload
        run: |
          echo "Building PoorDS4 binaries..."
          make release
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-sdk
      
      - name: List generated binaries
        run: |
          echo "=== Generated ELF binaries ==="
          ls -lh payload/*.elf 2>/dev/null || echo "No ELF files found"
          find payload -name "*.elf" -type f
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poords4-binaries
          path: payload/*.elf
          retention-days: 5
          if-no-files-found: warn
      
      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create pre-release on master push
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          tag_name: latest-build-${{ github.run_number }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
