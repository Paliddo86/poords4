name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euxo pipefail
          if ! command -v make >/dev/null 2>&1; then
            choco install -y make --no-progress
          fi
          if ! command -v git >/dev/null 2>&1; then
            choco install -y git --no-progress
          fi
          command -v make
          command -v git

      - name: Download PS5 SDK
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git "${GITHUB_WORKSPACE}/ps5-sdk"
          test -d "${GITHUB_WORKSPACE}/ps5-sdk"
          test -f "${GITHUB_WORKSPACE}/ps5-sdk/toolchain/prospero.mk"
          echo "SDK root: ${GITHUB_WORKSPACE}/ps5-sdk"
          ls -la "${GITHUB_WORKSPACE}/ps5-sdk"
          ls -la "${GITHUB_WORKSPACE}/ps5-sdk/toolchain"

      - name: Build binaries
        working-directory: ./payload
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-sdk
        run: |
          set -euxo pipefail
          echo "PS5_PAYLOAD_SDK=${PS5_PAYLOAD_SDK}"
          ls -la "${PS5_PAYLOAD_SDK}"
          ls -la "${PS5_PAYLOAD_SDK}/toolchain"
          make release

      - name: List generated binaries
        run: |
          set -euxo pipefail
          ls -lh payload/*.elf 2>/dev/null || true
          find payload -maxdepth 1 -name "*.elf" -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poords4-binaries
          path: payload/*.elf
          retention-days: 5
          if-no-files-found: error

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          tag_name: latest-build-${{ github.run_number }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
