name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential make unzip wget curl git
          command -v make
          command -v git
          command -v unzip

      - name: Download PS5 SDK release
        run: |
          set -euxo pipefail

          SDK_RELEASE_API="https://api.github.com/repos/ps5-payload-dev/sdk/releases/latest"
          echo "Fetching latest PS5 SDK release metadata..."
          SDK_ASSET_URL=$(curl -fsSL "$SDK_RELEASE_API" | python3 -c "import sys, json; data=json.load(sys.stdin); print(next((a['browser_download_url'] for a in data.get('assets', []) if a.get('name','').endswith('.zip')), ''))")

          if [ -z "$SDK_ASSET_URL" ]; then
            echo "Failed to determine PS5 SDK zip asset URL"
            exit 1
          fi

          echo "Downloading SDK from: $SDK_ASSET_URL"
          wget -O ps5-sdk.zip "$SDK_ASSET_URL"

          mkdir -p "$GITHUB_WORKSPACE/ps5-sdk"
          unzip -q ps5-sdk.zip -d "$GITHUB_WORKSPACE"

          # The SDK zip usually contains a single top-level directory.
          # If it does, flatten it into $GITHUB_WORKSPACE/ps5-sdk.
          FOUND_ROOT=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -mindepth 1 -type d \( -name 'sdk' -o -name 'ps5-payload-sdk' \) | head -n 1 || true)
          if [ -n "$FOUND_ROOT" ] && [ "$FOUND_ROOT" != "$GITHUB_WORKSPACE/ps5-sdk" ]; then
            shopt -s dotglob
            cp -a "$FOUND_ROOT"/. "$GITHUB_WORKSPACE/ps5-sdk/"
            shopt -u dotglob
          fi

          echo "SDK directory content:"
          ls -la "$GITHUB_WORKSPACE/ps5-sdk"

          if [ ! -f "$GITHUB_WORKSPACE/ps5-sdk/toolchain/prospero.mk" ]; then
            echo "ERROR: prospero.mk not found in extracted SDK"
            find "$GITHUB_WORKSPACE" -path '*/toolchain/prospero.mk' -print
            exit 1
          fi

      - name: Build binaries
        working-directory: ./payload
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-sdk
        run: |
          set -euxo pipefail
          echo "PS5_PAYLOAD_SDK=${PS5_PAYLOAD_SDK}"
          ls -la "${PS5_PAYLOAD_SDK}"
          ls -la "${PS5_PAYLOAD_SDK}/toolchain" || true
          make release

      - name: List generated binaries
        run: |
          set -euxo pipefail
          ls -lh payload/*.elf 2>/dev/null || true
          find payload -maxdepth 1 -name "*.elf" -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poords4-binaries
          path: payload/*.elf
          retention-days: 5
          if-no-files-found: error

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            payload/PoorDS4rc*.elf
            payload/PoorDS4exp.elf
            payload/PoorDS4-status.elf
            payload/PoorDS4-stop.elf
          tag_name: latest-build-${{ github.run_number }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
